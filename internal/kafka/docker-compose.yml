      # ACL
      - KAFKA_CFG_AUTHORIZER_CLASS_NAME=org.apache.kafka.metadata.authorizer.StandardAuthorizer
      - KAFKA_CFG_ALLOW_EVERYONE_IF_NO_ACL_FOUND=false
      # SSL
      - KAFKA_CFG_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM=
      - KAFKA_CERTIFICATE_PASSWORD=supersecret
      - KAFKA_TLS_TYPE=JKS
      # SASL
      - KAFKA_CFG_SASL_ENABLED_MECHANISMS=PLAIN
      # COMMON SETTINGS
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=false
    volumes:
      - kafka_2_data:/bitnami/kafka
      - ./keystore/kafka-2.server.keystore.jks:/opt/bitnami/kafka/config/certs/kafka.keystore.jks:ro
      - ./truststore/kafka.truststore.jks:/opt/bitnami/kafka/config/certs/kafka.truststore.jks:ro
    healthcheck:
      test: "bash -c 'printf \"\" > /dev/tcp/127.0.0.1/9091; exit $$?;'"
      interval: 5s
      timeout: 10s
      retries: 3
      start_period: 30s
  
  kafka-init:
    image: docker.io/bitnami/kafka:3.7
    depends_on:
      kafka-0:
        condition: service_healthy
    networks:
      - kafka
    environment:
      - KAFKA_HEAP_OPTS=-Xms128m -Xmx512m
    entrypoint: 
      - /bin/bash
      - -c 
      - | 

        until kafka-topics.sh --bootstrap-server kafka-0:9091 \
          --command-config /opt/bitnami/kafka/config/client.properties.da \
          --list >/dev/null 2>&1; do
          echo "Waiting for Kafka to be ready..."
          sleep 3
        done

        kafka-acls.sh --bootstrap-server kafka-0:9091 \
        --command-config /opt/bitnami/kafka/config/admin.properties \
        --add \
        --allow-principal User:da \
        --operation Create \
        --topic auth-topic 

        kafka-topics.sh --bootstrap-server kafka-0:9091 \
        --command-config /opt/bitnami/kafka/config/client.properties.da \
        --create --topic auth-topic \
        --partitions 3 \
        --replication-factor 3 \
        --if-not-exists

    volumes: 
      - ./admin.properties:/opt/bitnami/kafka/config/admin.properties:ro
      - ./client.properties.da:/opt/bitnami/kafka/config/client.properties.da:ro
      - ./truststore/kafka.truststore.jks:/opt/bitnami/kafka/config/certs/kafka.truststore.jks:ro
      - ./keystore/kafka.keystore.jks:/opt/bitnami/kafka/config/certs/kafka.keystore.jks:ro

volumes:
  kafka_0_data:
  kafka_1_data:
  kafka_2_data:

networks:
  kafka: